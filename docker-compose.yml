services:
  api:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "pip install -r backend/requirements.txt &&
             uvicorn backend.app.main:app --host 0.0.0.0 --port 8090"
    ports:
      - "8090:8090"
    environment:
      LLM_BASE_URL: ${LLM_BASE_URL:-http://10.0.1.121:8081/v1}
      LLM_API_KEY: ${LLM_API_KEY:-none}
      LLM_MODEL: ${LLM_MODEL:-qwen3.8-27b}
      LS_DB: /app/data/livingseries.db
      LS_LLM_REQUIRED: "0"

  bot:
    image: python:3.12-slim
    working_dir: /app
    volumes:
      - .:/app
    command: >
      sh -c "pip install -r backend/requirements.txt &&
             python -m backend.app.discord_bot"
    depends_on:
      - api
    environment:
      DISCORD_TOKEN: ${DISCORD_TOKEN:-}
      LS_API_BASE: http://api:8090
